baseURL = 'https://incredible-consulting.com/'
locale = 'en-us'
theme = "incredible"
title = 'Incredible Consulting'
# House style: emojis are banned across content, layouts, and config.
enableEmoji = false
disableHugoGeneratorInject = true
disableKinds = ['taxonomy', 'term']

# Brand palette (for the later theming pass):
#   green #3D8F37 · dark #0a1a08 · white #fff · background #f8f9f6
#   Font: Inter

[params]
  description  = "AI, cloud, automation, and data consulting for teams that need working systems, not decks."
  tagline      = "Consulting · Vienna · AI and Cloud"
  email        = "hello@incredible-consulting.com"
  linkedin     = "https://www.linkedin.com/in/linda-mohamed"
  github       = "https://github.com/linda-mhmd"
  booking      = "https://outlook.office.com/book/hello@lindamohamed.com/?ismsaljsauthenabled"
  parent       = "https://incredible-company.com/"

  # Sibling domains in the Incredible portfolio
  consulting_org = "https://incredible-consulting.org/"
  builders       = "https://incredible.builders/"
  community      = "https://incredible.community/"
  training       = "https://incredible.training/"
  founder        = "https://lindamohamed.work/"

