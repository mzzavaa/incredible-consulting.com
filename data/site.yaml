# Per-site identity. The theme reads only these keys, so nothing in
# themes/incredible is hardcoded to one domain.

sublabel: "Consulting"
# The booking page. This is the ONLY copy of it: every button on the site
# renders from this key, through nav.html, hero.html and cta-band.html. It is
# not "hello@", which is the contact address and not the booking mailbox.
booking_url: "https://outlook.office.com/book/Letstalk@lindamohamed.com/?ismsaljsauthenabled"
strapline: "A cooperative of independent technology experts."
cta_line_1: "The right expertise."
cta_line_2: "Assembled for your challenge."
# The label on every booking button: nav, mobile drawer, hero, closing band.
# It was "Request an Introduction", which came from the membership-by-
# invitation framing the homepage has dropped. What is actually on offer is
# the free idea call, which is what the intro deck calls it too.
primary_cta: "Book an idea call"

# Secondary hero control. Points at the page that explains how the work runs.
# Read by themes/incredible/layouts/partials/hero.html; omit it and the hero
# renders the primary button alone.
secondary_cta: "How we deliver"
secondary_cta_url: "/method/"

# Default social card, used by head.html when a page sets neither social_image
# nor image. Statement images carry their wording in the pixels, which is right
# for a share preview and wrong for page content: see layouts/shortcodes/poster.html.
social_image: "img/mood/mechanism.webp"

family:
  - { name: "Company",    url: "https://incredible-company.com" }
  - { name: "Consulting", url: "https://incredible-consulting.com" }
  - { name: "Method",     url: "https://incredible-consulting.org" }
  - { name: "Builders",   url: "https://incredible.builders" }
  - { name: "Community",  url: "https://incredible.community" }
  - { name: "Training",   url: "https://incredible.training" }
