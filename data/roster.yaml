# The roster: the named people who lead engagements.
#
# One entry per person who can be the named lead in a proposal. This is not a
# capacity list and not a list of everyone who has ever contributed. A person
# appears here only once all three are true:
#   1. they have led a delivered engagement, or are contracted to lead the next
#   2. they have agreed in writing to be listed, with this photograph
#   3. there is a profile page for them under content/team/
#
# Associates who are brought in by name for one discipline are NOT listed here.
# They are described on /team/network/ and named in the proposal instead. The
# distinction is deliberate: a roster that quietly includes everyone available
# is the bench model this site exists to argue against.
#
# There is no rank field, and there should not be one. The site's position is
# that a title is self-awarded and the work is not, so a person is described by
# what they lead and what they have shipped. See /team/ for the standard.
#
# `portrait` is a path inside assets/, processed by Hugo. Real photographs only.
# See IMAGE-BRIEF in the portfolio root: generated faces are a design
# placeholder and are misleading as published content.

- slug: linda-mohamed
  name: "Linda Mohamed"
  role: "Founder and Principal Consultant"
  page: "/team/linda-mohamed/"
  portrait: "images/linda-mohamed-portrait.jpg"
  guilds: [ai, cloud, data, platform]
  location: "Austria"
  languages: ["German", "English"]
  credentials: ["AWS Community Hero", "AWS User Group Vienna organiser"]
  status: active

# Open. The roster is intended to grow, by introduction rather than by
# recruitment. The standard, open disciplines and contracting are on
# /team/network/. Do not add a speculative or placeholder entry here: an empty
# roster of one is honest, and an invented second name is not.
